<!doctype html>
<html lang="ru" data-theme="auto">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https: data: blob:; media-src 'self' https: blob:; connect-src 'self' https:; worker-src 'self'; object-src 'none'; base-uri 'self';" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Sonora" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F2F2F7" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
  <title>Sonora</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <!-- Top iOS Translucent Header -->
    <header class="ios-navbar" id="ios-navbar">
      <div class="ios-navbar-inner">
        <div class="brand-row">
          <img src="icons/icon-192.png" alt="Sonora" class="brand-icon" />
          <h1 class="ios-title" id="header-title">Главная</h1>
        </div>
        <div class="header-actions" id="header-actions"></div>
      </div>
    </header>

    <!-- Update & Install Banners -->
    <div id="banner-slot" class="banner-slot"></div>

    <!-- Main Scrollable Tab Content -->
    <main id="main-content" class="main-content" role="main"></main>

    <!-- Floating Mini-Player above Tab Bar -->
    <section id="mini-player" class="mini-player hidden" aria-label="Мини-плеер"></section>

    <!-- Native iOS Translucent Tab Bar -->
    <nav class="ios-tabbar" aria-label="Навигация">
      <button type="button" class="tab-btn active" data-tab="home" aria-label="Главная">
        <svg viewBox="0 0 24 24" class="tab-icon" aria-hidden="true"><path d="M12 3.17L3 10.67V21h6v-6h6v6h6V10.67L12 3.17z"/></svg>
        <span>Главная</span>
      </button>
      <button type="button" class="tab-btn" data-tab="search" aria-label="Поиск">
        <svg viewBox="0 0 24 24" class="tab-icon" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79L20 21.49 21.49 20 15.5 14zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <span>Поиск</span>
      </button>
      <button type="button" class="tab-btn" data-tab="library" aria-label="Медиатека">
        <svg viewBox="0 0 24 24" class="tab-icon" aria-hidden="true"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-3 9h-2v4.5a2.5 2.5 0 11-1.5-2.29V6h3.5V11z"/></svg>
        <span>Медиатека</span>
      </button>
      <button type="button" class="tab-btn" data-tab="settings" aria-label="Настройки">
        <svg viewBox="0 0 24 24" class="tab-icon" aria-hidden="true"><path d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.5.5 0 00.12-.64l-1.92-3.32a.5.5 0 00-.6-.22l-2.39.96a7.1 7.1 0 00-1.62-.94l-.36-2.54a.49.49 0 00-.48-.42h-3.84a.49.49 0 00-.48.42l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96a.5.5 0 00-.6.22L2.74 8.84a.5.5 0 00.12.64l2.03 1.58c-.05.3-.08.62-.08.94s.03.64.08.94l-2.03 1.58a.5.5 0 00-.12.64l1.92 3.32a.5.5 0 00.6.22l2.39-.96c.49.38 1.03.7 1.62.94l.36 2.54c.05.24.25.42.48.42h3.84c.23 0 .44-.18.48-.42l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96a.5.5 0 00.6-.22l1.92-3.32a.5.5 0 00-.12-.64l-2.03-1.58zM12 15.6A3.6 3.6 0 1112 8.4a3.6 3.6 0 010 7.2z"/></svg>
        <span>Настройки</span>
      </button>
    </nav>

    <!-- Fullscreen Player Sheet -->
    <div id="player-sheet" class="player-sheet hidden" role="dialog" aria-modal="true" aria-label="Плеер"></div>

    <!-- Reusable Modal / Action Sheet -->
    <div id="modal-backdrop" class="modal-backdrop hidden" role="dialog" aria-modal="true">
      <div id="modal-sheet" class="modal-sheet"></div>
    </div>

    <!-- Hidden File Input for Backup Import -->
    <input type="file" id="backup-file-input" class="hidden" accept=".json,.sonoraenc,application/json" />

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  </div>

  <script type="module" src="src/app.js"></script>
</body>
</html>
