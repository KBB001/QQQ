name: Build & Deploy iOS PWA (GitHub Pages)

on:
  push:
    branches: ["main", "master"]
    paths:
      - "ios-pwa/**"
      - "server/**"
      - "cloudflare-worker/**"
      - ".github/workflows/deploy-ios-pwa.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-ios-pwa"
  cancel-in-progress: true

jobs:
  test-and-stage:
    name: Test & Package iOS PWA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run iOS PWA & Server Unit Tests
        run: |
          node --test ios-pwa/tests/pwa.test.mjs
          node --test server/tests/server.test.mjs

      - name: Validate PWA Assets & Manifest
        run: |
          test -f ios-pwa/index.html
          test -f ios-pwa/manifest.webmanifest
          test -f ios-pwa/sw.js
          test -f ios-pwa/src/recommendations.js
          test -f ios-pwa/src/offline.js
          test -f ios-pwa/src/modals.js
          test -f ios-pwa/icons/apple-touch-icon.png
          test -f ios-pwa/icons/icon-192.png
          test -f ios-pwa/icons/icon-512.png
          node -e "JSON.parse(require('fs').readFileSync('ios-pwa/manifest.webmanifest', 'utf8'))"

      - name: Stage PWA Bundle & Stamp Auto-Update Version
        run: |
          rm -rf _site
          mkdir -p _site
          cp -r ios-pwa/* _site/
          rm -rf _site/tests
          sed -i "s/__BUILD_VERSION__/${GITHUB_SHA}/g" _site/sw.js
          touch _site/.nojekyll

      - name: Upload Packaged iOS PWA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonora-ios-pwa-bundle
          path: "_site"

      - name: Setup Pages (Auto-Enable if Needed)
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Explain Pages Setup Error
        if: steps.pages.outcome != 'success'
        run: |
          echo "::error::GitHub Pages не включён или недоступен для этого репозитория. Откройте Settings → Pages → Source: GitHub Actions. Если репозиторий приватный (Private) на бесплатном тарифе GitHub, переведите его в Public (Settings → General → Change repository visibility) — GitHub Pages для Private-репозиториев требует план Pro/Team. Собранный архив sonora-ios-pwa-bundle при этом сохранён в Artifacts этого запуска."
          exit 1

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: test-and-stage
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
