services:
  - type: web
    name: sonora-ytmusic-backend
    runtime: node
    rootDir: server
    plan: free
    buildCommand: "echo 'No build step required'"
    startCommand: "npm start"
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ALLOWED_ORIGINS
        value: https://kbb001.github.io
      - key: SONORA_SERVER_PASSCODE
        sync: false
